name: 🔄 RAWG Monthly Ingestion ETL

on:
  # 1. Execução Agendada (CRON)
  schedule:
    - cron: '0 0 1 * *' # Executa às 00:00 do dia 1º de cada mês
  
  # 2. Execução Manual (Essencial para testes)
  workflow_dispatch: 

jobs:
  sync-data:
    name: 📥 Extração, Transformação e Carga (ETL)
    runs-on: ubuntu-latest
    
    # Define um limite de tempo máximo (timeout) para evitar que um job 
    # travado consuma os seus minutos gratuitos do GitHub Actions
    timeout-minutes: 30 

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      # TOQUE DE ARQUITETO: Fazer cache do modelo de IA (HuggingFace)
      # Evita que o GitHub Actions baixe os 22MB do modelo 'all-MiniLM-L6-v2' a cada execução
      - name: 🧠 Cache do Modelo Local de Embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-${{ hashFiles('scripts/rawg-monthly-sync.ts') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-

      - name: 🚀 Executar Script de Ingestão RAWG
        env:
          # Mapeamento estrito das variáveis de ambiente usando GitHub Secrets
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/rawg-monthly-sync.ts
